name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test core logic
        run: swift test --disable-sandbox
      - name: Build universal app
        run: ./build.sh
      - name: Verify isolated debug app
        run: ./Tests/verify-debug-bundle.sh
